name: daily

on:
  schedule:
    # 09:15 UTC on weekdays — after the US close settles and before the
    # European open, so a snapshot lands every trading day.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_prices:
        description: "Skip the price refresh (faster run)"
        type: boolean
        default: false

concurrency:
  group: pricedin-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Both databases are gitignored and rebuildable, so restore them from
      # cache rather than re-downloading millions of rows every run.
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: |
            data/market.db
            data/core.db
          key: pricedin-db-${{ github.run_id }}
          restore-keys: pricedin-db-

      # The archive is the durable copy. On a cache miss this is what stops a
      # cold runner from losing the snapshot history entirely.
      - name: Rebuild snapshot history from archive
        run: |
          python db.py
          python db.py import

      - name: Run daily collection
        env:
          PRICEDIN_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRICEDIN_YF_SLEEP: "0.35"
        run: |
          python daily.py \
            --workers 4 \
            ${{ inputs.skip_prices && '--skip-prices' || '' }}

      - name: Commit snapshot history
        run: |
          python db.py export
          git config user.name  "pricedin-bot"
          git config user.email "actions@github.com"
          git add data/snapshots.csv.gz results/dashboard.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: results/dashboard.html
          retention-days: 30
