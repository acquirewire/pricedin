name: daily

on:
  schedule:
    # 09:15 UTC on weekdays — after the US close settles and before the
    # European open, so a snapshot lands every trading day.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_prices:
        description: "Skip the price refresh (faster run)"
        type: boolean
        default: false

concurrency:
  group: pricedin-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Both databases are gitignored and rebuildable, so restore them from
      # cache rather than re-downloading millions of rows every run.
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: |
            data/market.db
            data/core.db
          key: pricedin-db-${{ github.run_id }}
          restore-keys: pricedin-db-

      # The archives are the durable copies. On a cache miss these are what
      # stop a cold runner from silently restarting with no consensus history
      # and an empty portfolio.
      - name: Rebuild state from archives
        run: |
          python db.py
          python db.py import
          python paper.py --import

      - name: Run daily collection
        env:
          PRICEDIN_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRICEDIN_YF_SLEEP: "0.35"
        run: |
          python daily.py \
            --workers 4 \
            ${{ inputs.skip_prices && '--skip-prices' || '' }}

      - name: Commit data
        run: |
          python db.py export
          python paper.py --export
          git config user.name  "pricedin-bot"
          git config user.email "actions@github.com"
          # web/src/data is what the site actually reads, so it has to be
          # committed too — otherwise the build publishes yesterday's numbers.
          git add data/snapshots.csv.gz \
                  data/paper_history.csv.gz \
                  data/paper_equity.csv.gz \
                  results/dashboard.html \
                  results/portfolio.html \
                  web/src/data
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: results/dashboard.html
          retention-days: 30

      # The site reads web/src/data/*.json at BUILD time, so refreshing the
      # data is not enough on its own — it has to be rebuilt and republished
      # or the published pages keep showing whatever was true at the last build.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
